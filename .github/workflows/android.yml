name: Build Android APK (backup builder)

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Supabase URL (blank = use saved secret)"
        required: false
        type: string
      supabase_anon_key:
        description: "Supabase anon key (blank = use saved secret)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          channel: beta

      - name: Generate fresh Android project
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name clip_app --org com.gta6.clipper .

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_app
        env:
          SB_URL: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
          SB_KEY: ${{ inputs.supabase_anon_key || secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SB_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SB_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-backup
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
