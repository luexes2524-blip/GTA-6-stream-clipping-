name: Auto Clip Live Stream

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Video or live stream link to clip"
        required: true
        type: string
      start_seconds:
        description: "Start time in seconds (e.g. 3720 for 1:02:00)"
        required: false
        default: "0"
        type: string
      duration_seconds:
        description: "Clip length in seconds"
        required: false
        default: "60"
        type: string

jobs:
  clip-live-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      CLIP_START_SECONDS: ${{ inputs.start_seconds || '0' }}
      CLIP_DURATION_SECONDS: ${{ inputs.duration_seconds || '60' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp

      - name: Run clipper
        run: python clipper.py

      - name: Keep a copy of the clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip
          path: output/clip_with_captions.mp4
          if-no-files-found: ignore
