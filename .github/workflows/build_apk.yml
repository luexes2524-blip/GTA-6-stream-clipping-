name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Supabase URL (blank = use saved secret)"
        required: false
        type: string
      supabase_anon_key:
        description: "Supabase anon key (blank = use saved secret)"
        required: false
        type: string
      build_type:
        description: "debug installs anywhere; release is smaller"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate fresh Android project
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name clip_app --org com.gta6.clipper .

      - name: Allow internet in release builds
        working-directory: mobile_app
        run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_app
        env:
          SB_URL: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
          SB_KEY: ${{ inputs.supabase_anon_key || secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --${{ inputs.build_type }} \
            --dart-define=SUPABASE_URL="$SB_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SB_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
